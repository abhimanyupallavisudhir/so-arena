[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oversight-arena"
version = "0.1.0"
description = "Experiments on the incentives induced by multi-agent oversight mechanisms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/abhimanyupallavisudhir/so-arena"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]
inspect = ["inspect-ai>=0.3.268,<0.4"]
plots = ["matplotlib>=3.9,<4"]
chess = ["python-chess>=1.999,<2"]

[project.scripts]
oversight-arena = "oversight_arena.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oversight_arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
